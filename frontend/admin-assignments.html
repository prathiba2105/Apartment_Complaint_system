<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignments - Apartment Care Admin</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar" id="appSidebar"></aside>
    <div class="main-wrapper">
      <header class="topbar" id="appTopbar"></header>
      <main class="main-content">
        <div class="page-header flex-between">
          <div>
            <div class="welcome-title">Worker Assignments</div>
            <div class="welcome-sub">Review and assign workers to complaints</div>
          </div>
          <div class="flex gap-1">
            <select class="filter-select" id="assignFilter">
              <option value="PENDING">Unassigned (Pending)</option>
              <option value="ASSIGNED">Assigned</option>
              <option value="IN_PROGRESS">In Progress</option>
              <option value="">All</option>
            </select>
          </div>
        </div>

        <div class="card">
          <div class="card-head"><h3>Complaints</h3></div>
          <div class="card-body" style="padding:0;">
            <div class="table-wrap">
              <table class="table">
                <thead>
                  <tr><th>#</th><th>Title</th><th>Resident</th><th>Location</th><th>Category</th><th>Priority</th><th>Status</th><th>Worker</th><th>Action</th></tr>
                </thead>
                <tbody id="assignmentsBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Assign / reassign modal -->
  <div class="modal-overlay" id="assignModal">
    <div class="modal lg">
      <div class="modal-header"><h3>Assign / Reassign Worker</h3><button class="modal-close" onclick="closeModal('assignModal')">&times;</button></div>
      <div class="modal-body">
        <p class="mb-2"><strong>Complaint:</strong> <span id="assignComplaintTitle"></span></p>
        <div id="assignComplaintContext" class="mb-2" style="background:var(--bg);border-radius:8px;padding:12px;font-size:13px;display:flex;gap:12px;flex-wrap:wrap;"></div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Expected Completion Date</label><input type="date" class="form-control no-icon" id="assignExpectedDate" /></div>
          <div class="form-group"><label class="form-label">Instructions for Worker</label><input class="form-control no-icon" id="assignInstructions" placeholder="e.g. Carry pipe repair kit" /></div>
        </div>
        <p class="text-muted mb-2" style="font-size:13px">Select a worker. Matching category &amp; available workers recommended first.</p>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Worker</th><th>Category</th><th>Experience</th><th>Availability</th><th>Current Tasks</th></tr></thead>
            <tbody id="assignWorkerBody"></tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal('assignModal')">Cancel</button>
        <button class="btn btn-purple" id="confirmAssignBtn">Assign Worker</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/socket.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/notifications.js"></script>
  <script>
    let allAssignments = [];
    async function loadAssignments() {
      const s = document.getElementById('assignFilter').value;
      try {
        const data = await API.get(`/api/admin/complaints${s ? '?status=' + s : ''}`);
        allAssignments = data.complaints || [];
        renderAssignments(allAssignments);
      } catch (e) {
        document.getElementById('assignmentsBody').innerHTML = '<tr><td colspan="9"><div class="empty-state">Failed to load complaints.</div></td></tr>';
      }
    }
    function renderAssignments(list) {
      const tbody = document.getElementById('assignmentsBody');
      if (!list.length) { tbody.innerHTML = '<tr><td colspan="9"><div class="empty-state">No complaints in this view.</div></td></tr>'; return; }
      tbody.innerHTML = list.map((c) => {
        const user = c.userId || {};
        const worker = c.assignedWorker ? c.assignedWorker.name : '—';
        const isPending = c.status === 'PENDING' || c.status === 'REOPENED';
        return `
        <tr>
          <td class="muted-cell">${c.complaintId}</td>
          <td class="title-cell"><a href="complaint-details.html?id=${c._id}" style="color:var(--navy)">${c.title}</a></td>
          <td>${user.name || '—'}</td>
          <td class="muted-cell">Flat ${user.flat || '—'}${user.block ? ', Block ' + user.block : ''}</td>
          <td><span class="badge badge-active">${c.category}</span></td>
          <td>${priorityBadge(c.priority)}</td>
          <td>${statusBadge(c.status)}</td>
          <td>${worker}</td>
          <td>
            <button class="btn btn-outline btn-sm" data-view="${c._id}">View</button>
            <button class="btn btn-purple btn-sm" data-assign="${c._id}">${isPending ? 'Assign' : 'Reassign'}</button>
          </td>
        </tr>`;
      }).join('');
      tbody.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => (window.location.href = `complaint-details.html?id=${b.dataset.view}`)));
      tbody.querySelectorAll('[data-assign]').forEach((b) => b.addEventListener('click', () => {
        const c = allAssignments.find((x) => x._id === b.dataset.assign);
        if (c) openAssignModal(c);
      }));
    }
    document.getElementById('confirmAssignBtn').addEventListener('click', submitAssignment);
    document.getElementById('assignFilter').addEventListener('change', loadAssignments);
    document.addEventListener('DOMContentLoaded', async () => {
      if (!requireAuth('ADMIN')) return;
      buildSidebar('ADMIN', 'assignments');
      buildTopbar('ADMIN');
      loadAssignments();
      loadNotificationBadge('ADMIN');
      onRealtimeEvents({ complaintAssigned: loadAssignments, complaintStatusUpdated: loadAssignments, newComplaint: loadAssignments });
    });
  </script>
</body>
</html>
