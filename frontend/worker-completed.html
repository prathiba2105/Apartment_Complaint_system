<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Completed Tasks - Apartment Care</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar" id="appSidebar"></aside>
    <div class="main-wrapper">
      <header class="topbar" id="appTopbar"></header>
      <main class="main-content">
        <div class="page-header">
          <div class="welcome-title">Completed Tasks</div>
          <div class="welcome-sub">Complaints you have completed</div>
        </div>
        <div class="card">
          <div class="card-head"><h3>Completed Tasks</h3></div>
          <div class="card-body" style="padding:0;">
            <div class="table-wrap">
              <table class="table">
                <thead><tr><th>#</th><th>Title</th><th>Flat</th><th>Category</th><th>Priority</th><th>Status</th><th>Completed On</th></tr></thead>
                <tbody id="completedBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/socket.js"></script>
  <script src="js/common.js"></script>
  <script src="js/worker.js"></script>
  <script src="js/notifications.js"></script>
  <script>
    async function loadCompleted() {
      try {
        const data = await API.get('/api/worker/dashboard');
        const list = (data.complaints || []).filter((c) => c.status === 'COMPLETED');
        const tbody = document.getElementById('completedBody');
        if (!list.length) {
          tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state">No completed tasks yet.</div></td></tr>';
          return;
        }
        tbody.innerHTML = list.map((c, i) => `
          <tr>
            <td class="muted-cell">${i + 1}</td>
            <td class="title-cell">${c.title}<br/><span class="text-muted" style="font-size:12px">${c.complaintId}</span></td>
            <td>Flat ${(c.userId && c.userId.flat) || '—'}</td>
            <td><span class="badge badge-active">${c.category}</span></td>
            <td>${priorityBadge(c.priority)}</td>
            <td>${statusBadge(c.status)}</td>
            <td class="muted-cell">${formatDate(c.completedAt)}</td>
          </tr>`).join('');
      } catch (e) {
        document.getElementById('completedBody').innerHTML = '<tr><td colspan="7"><div class="empty-state">Failed to load tasks.</div></td></tr>';
      }
    }
    document.addEventListener('DOMContentLoaded', async () => {
      if (!requireAuth('WORKER')) return;
      buildSidebar('WORKER', 'completed');
      buildTopbar('WORKER');
      loadCompleted();
      loadNotificationBadge('WORKER');
    });
  </script>
</body>
</html>
