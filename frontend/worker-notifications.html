<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worker Notifications - Apartment Care</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar" id="appSidebar"></aside>
    <div class="main-wrapper">
      <header class="topbar" id="appTopbar"></header>
      <main class="main-content" style="max-width:820px;">
        <div class="page-header">
          <div class="welcome-title">Notifications</div>
          <div class="welcome-sub">Your assignment notifications</div>
        </div>
        <div id="notificationsContainer"></div>
      </main>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/socket.js"></script>
  <script src="js/common.js"></script>
  <script src="js/notifications.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!requireAuth('WORKER')) return;
      buildSidebar('WORKER', 'notifications');
      buildTopbar('WORKER');
      initSocket();
      loadNotifications('WORKER', 'notificationsContainer');
      loadNotificationBadge('WORKER');
      onRealtimeEvents({ notificationCreated: () => loadNotifications('WORKER', 'notificationsContainer') });
    });
  </script>
</body>
</html>
