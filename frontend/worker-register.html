<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worker Registration - Apartment Care</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-left">
      <div class="brand-logo">
        <div class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
            <path d="M3 21h18M5 21V8l7-4 7 4v13" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9 21v-5h6v5" stroke="#2CBF77" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M10 8h1M13 8h1" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <div class="brand-title">Apartment Care</div>
          <div class="brand-sub">Smart Apartment<br />Complaint Resolution System</div>
        </div>
      </div>
      <div class="auth-slogan">
        <h1>Smart Apartment<br />Complaint Resolution System</h1>
        <div class="slogan">
          <div class="line1">“Your complaint”</div>
          <div class="line2">“Our responsibility”</div>
        </div>
      </div>
      <div class="auth-illustration">
        <svg width="380" height="300" viewBox="0 0 380 300" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="190" cy="280" rx="140" ry="18" fill="#C9E0F2"/>
          <rect x="158" y="220" width="22" height="60" rx="6" fill="#123E73"/>
          <rect x="200" y="220" width="22" height="60" rx="6" fill="#123E73"/>
          <rect x="152" y="276" width="34" height="12" rx="5" fill="#0B2748"/>
          <rect x="194" y="276" width="34" height="12" rx="5" fill="#0B2748"/>
          <rect x="140" y="160" width="100" height="66" rx="14" fill="#1769AA"/>
          <path d="M190 160 L190 226" stroke="#123E73" stroke-width="2"/>
          <rect x="176" y="176" width="28" height="20" rx="4" fill="#fff" opacity="0.25"/>
          <rect x="140" y="214" width="100" height="10" rx="3" fill="#0B2748"/>
          <path d="M140 180 L150 190 L168 178" fill="#1769AA"/>
          <path d="M240 180 L230 190 L212 178" fill="#1769AA"/>
          <circle cx="166" cy="180" r="15" fill="#2E5E93"/>
          <circle cx="214" cy="180" r="15" fill="#2E5E93"/>
          <circle cx="190" cy="140" r="30" fill="#F2C49B"/>
          <path d="M158 138 Q190 108 222 138 L222 148 Q190 128 158 148 Z" fill="#123E73"/>
          <path d="M158 140 L222 140" stroke="#0B2748" stroke-width="3"/>
          <path d="M188 110 L192 96 L198 110" fill="#FFD34D"/>
          <circle cx="180" cy="142" r="3" fill="#2B2B2B"/>
          <circle cx="200" cy="142" r="3" fill="#2B2B2B"/>
          <path d="M182 154 Q190 160 198 154" stroke="#2B2B2B" stroke-width="2" fill="none"/>
          <rect x="232" y="196" width="30" height="34" rx="7" fill="#E97E22"/>
          <rect x="238" y="200" width="18" height="8" rx="3" fill="#C96A1A"/>
          <path d="M240 208 L250 222 M250 208 L240 222" stroke="#C96A1A" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <div class="auth-right" style="align-items:flex-start;">
      <div class="auth-card wide">
        <div class="auth-card-head">
          <div class="auth-card-icon blue">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
              <path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
            </svg>
          </div>
          <h2>Worker Registration</h2>
          <p>Join our maintenance services team</p>
        </div>

        <form id="workerRegisterForm">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <div class="input-wrap">
              <span class="field-icon">👤</span>
              <input type="text" class="form-control" id="name" placeholder="Enter your full name" required />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Email Address</label>
            <div class="input-wrap">
              <span class="field-icon">✉️</span>
              <input type="email" class="form-control" id="email" placeholder="you@example.com" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Password</label>
              <div class="input-wrap password-wrap">
                <span class="field-icon">🔒</span>
                <input type="password" class="form-control" id="password" placeholder="Min 6 characters" required />
                <button type="button" class="toggle-pw">👁️</button>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Confirm Password</label>
              <div class="input-wrap password-wrap">
                <span class="field-icon">🔒</span>
                <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter password" required />
                <button type="button" class="toggle-pw">👁️</button>
              </div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Mobile Number</label>
              <div class="input-wrap">
                <span class="field-icon">📱</span>
                <input type="text" class="form-control" id="phone" placeholder="10-digit mobile" />
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Experience (Years)</label>
              <div class="input-wrap">
                <span class="field-icon">⭐</span>
                <input type="number" min="0" class="form-control" id="experience" placeholder="e.g. 3" />
              </div>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Select Category</label>
            <div class="input-wrap">
              <span class="field-icon">🛠️</span>
              <select class="form-control" id="category" required>
                <option value="">Select your category</option>
                <option value="Plumbing">Plumbing</option>
                <option value="Electrical">Electrical</option>
                <option value="Cleaning">Cleaning</option>
                <option value="Security">Security</option>
                <option value="Carpentry">Carpentry</option>
                <option value="Painting">Painting</option>
                <option value="Lift Maintenance">Lift Maintenance</option>
                <option value="Water Maintenance">Water Maintenance</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Address</label>
            <div class="input-wrap">
              <span class="field-icon">📍</span>
              <input type="text" class="form-control" id="address" placeholder="Enter your address" />
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block register-btn" id="registerBtn" style="padding:13px;">
            Register
          </button>

          <div class="auth-switch">
            Already have an account? <a href="worker-login.html">Login</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('workerRegisterForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = document.getElementById('password').value;
      const cpw = document.getElementById('confirmPassword').value;
      if (pw !== cpw) {
        toast.error('Passwords do not match');
        return;
      }
      if (!document.getElementById('category').value) {
        toast.error('Please select a category');
        return;
      }
      const btn = document.getElementById('registerBtn');
      setBtnLoading(btn, true, '', 'Registering...');
      try {
        const data = await API.post('/api/auth/worker/register', {
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          password: pw,
          confirmPassword: cpw,
          phone: document.getElementById('phone').value,
          category: document.getElementById('category').value,
          experience: document.getElementById('experience').value,
          address: document.getElementById('address').value,
        });
        AuthStore.set(data);
        toast.success('Worker registered successfully', 'Redirecting to dashboard...');
        setTimeout(() => (window.location.href = 'worker-dashboard.html'), 700);
      } catch (err) {
        handleAuthError(err);
      } finally {
        setBtnLoading(btn, false);
      }
    });
  </script>
</body>
</html>
