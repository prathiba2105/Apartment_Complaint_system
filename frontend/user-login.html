<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Login - Apartment Care</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-left">
      <div class="brand-logo">
        <div class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
            <path d="M3 21h18M5 21V8l7-4 7 4v13" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9 21v-5h6v5" stroke="#2CBF77" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M10 8h1M13 8h1M10 11h1M13 11h1M10 14h1M13 14h1" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <div class="brand-title">Apartment Care</div>
          <div class="brand-sub">Smart Apartment<br />Complaint Resolution System</div>
        </div>
      </div>
      <div class="auth-slogan">
        <h1>Smart Apartment<br />Complaint Resolution System</h1>
        <div class="slogan">
          <div class="line1">“Your complaint”</div>
          <div class="line2">“Our responsibility”</div>
        </div>
      </div>
      <div class="auth-illustration">
        <svg width="440" height="260" viewBox="0 0 440 260" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 230 Q220 214 440 230 V260 H0 Z" fill="#7FC9A0"/>
          <rect x="40" y="130" width="80" height="100" rx="4" fill="#BBD8F0"/>
          <rect x="48" y="138" width="20" height="24" rx="2" fill="#8FB9DC"/>
          <rect x="76" y="138" width="20" height="24" rx="2" fill="#8FB9DC"/>
          <rect x="48" y="170" width="20" height="24" rx="2" fill="#8FB9DC"/>
          <rect x="76" y="170" width="20" height="24" rx="2" fill="#8FB9DC"/>
          <path d="M62 130 L62 100 L120 100 L120 130" fill="#9CC6E4"/>
          <rect x="160" y="70" width="90" height="160" rx="5" fill="#5A9BD3"/>
          <rect x="150" y="80" width="110" height="36" rx="4" fill="#4A8BC4"/>
          <rect x="172" y="86" width="10" height="18" fill="#123E73"/>
          <rect x="186" y="86" width="10" height="18" fill="#123E73"/>
          <rect x="200" y="86" width="10" height="18" fill="#123E73"/>
          <rect x="214" y="86" width="10" height="18" fill="#123E73"/>
          <rect x="172" y="120" width="22" height="28" rx="2" fill="#DCEBF9"/>
          <rect x="202" y="120" width="22" height="28" rx="2" fill="#DCEBF9"/>
          <rect x="172" y="156" width="22" height="28" rx="2" fill="#DCEBF9"/>
          <rect x="202" y="156" width="22" height="28" rx="2" fill="#DCEBF9"/>
          <rect x="172" y="192" width="22" height="28" rx="2" fill="#DCEBF9"/>
          <rect x="202" y="192" width="22" height="28" rx="2" fill="#DCEBF9"/>
          <rect x="290" y="110" width="70" height="120" rx="4" fill="#C6DFF2"/>
          <rect x="298" y="118" width="18" height="22" rx="2" fill="#9DC8E4"/>
          <rect x="324" y="118" width="18" height="22" rx="2" fill="#9DC8E4"/>
          <circle cx="20" cy="210" r="14" fill="#4C9F70"/>
          <rect x="18" y="214" width="4" height="16" fill="#8A5A3B"/>
          <circle cx="400" cy="196" r="12" fill="#58B483"/>
        </svg>
      </div>
    </div>

    <div class="auth-right">
      <div class="auth-card">
        <div class="auth-card-head">
          <div class="auth-card-icon blue">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
              <path d="M12 12a4 4 0 100-8 4 4 0 000 8z" stroke="#fff" stroke-width="1.6"/>
              <path d="M21 20c-.5-3.5-4.7-5-9-5s-8.5 1.5-9 5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </div>
          <h2>User Login</h2>
          <p>Access your complaint dashboard</p>
        </div>

        <form id="userLoginForm">
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <div class="input-wrap">
              <span class="field-icon">✉️</span>
              <input type="email" class="form-control" id="email" placeholder="you@example.com" required />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <div class="input-wrap password-wrap">
              <span class="field-icon">🔒</span>
              <input type="password" class="form-control" id="password" placeholder="Enter password" required />
              <button type="button" class="toggle-pw" title="Show/Hide">👁️</button>
            </div>
          </div>
          <div class="auth-links-row">
            <label class="checkbox-label"><input type="checkbox" id="remember" /> Remember Me</label>
            <a href="#">Forgot Password?</a>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
            Login
          </button>
        </form>

        <div class="auth-switch">
          Don't have an account? <a href="user-register.html">Register here</a>
        </div>
        <div class="auth-switch" style="margin-top:6px;">
          Are you a worker? <a href="worker-login.html">Worker Login</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('userLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      setBtnLoading(btn, true, '', 'Logging in...');
      try {
        const data = await API.post('/api/auth/login', {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        });
        AuthStore.set(data);
        toast.success('Login successful', 'Welcome back!');
        setTimeout(() => (window.location.href = 'user-dashboard.html'), 600);
      } catch (err) {
        handleAuthError(err);
      } finally {
        setBtnLoading(btn, false);
      }
    });
  </script>
</body>
</html>
